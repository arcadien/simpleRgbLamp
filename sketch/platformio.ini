[env]
lib_deps =
monitor_speed = 115200

[platformio]
src_dir=.

[env:attiny84]
    platform = atmelavr
    board = attiny84
    framework = arduino
    build_type = release
    board_build.mcu = attiny84
    board_build.f_cpu = 8000000L
    ; fuses (pio run -t fuses): internal 8 MHz RC without CKDIV8, BOD 2.7 V (disabled in sleep by firmware)
    ; set explicitly: PlatformIO does not generate fuses for ATTinyCore boards
    board_fuses.lfuse = 0xE2
    board_fuses.hfuse = 0xDD
    board_fuses.efuse = 0xFF
    ; adapt to your ISP programmer (usbasp, usbtiny, stk500v1 for Arduino as ISP...)
    upload_protocol = usbasp
